events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:3001;
    }

    upstream transaction_service {
        server transaction-service:3002;
    }

    upstream submission_service {
        server submission-service:3003;
    }

    upstream solver_model_service {
        server solver-model-service:3004;
    }

    upstream result_service {
        server result-service:3005;
    }

    upstream analytics_service {
        server analytics-service:3006;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;  # Increased log level for debugging

        # JWT validation endpoint
        location = /auth {
            internal;
            proxy_pass http://user_service/validate-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        # Public routes
        location ~ ^/api/user/(signup|signin)$ {
            rewrite ^/api/user(/.*)$ $1 break;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Protected user routes
        location /api/user {
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/api/user(/.*)$ $1 break;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User $upstream_http_x_user;
            proxy_set_header Authorization $http_authorization;

            error_page 401 = @error401;
            error_page 403 = @error403;
        }

        location /api/transaction {
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/api/transaction(/.*)$ $1 break;
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User $upstream_http_x_user;
            proxy_set_header Authorization $http_authorization;

            error_page 401 = @error401;
            error_page 403 = @error403;
        }


        location /api/solver {
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/api/solver(/.*)$ $1 break;
            proxy_pass http://solver_model_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User $upstream_http_x_user;
            proxy_set_header Authorization $http_authorization;

            error_page 401 = @error401;
            error_page 403 = @error403;
        }

        location /api/submission {
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/api/submission(/.*)$ $1 break;
            proxy_pass http://submission_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User $upstream_http_x_user;
            proxy_set_header Authorization $http_authorization;

            error_page 401 = @error401;
            error_page 403 = @error403;
        }

        location /api/result {
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/api/result(/.*)$ $1 break;
            proxy_pass http://result_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User $upstream_http_x_user;
            proxy_set_header Authorization $http_authorization;

            error_page 401 = @error401;
            error_page 403 = @error403;
        }

        location /api/analytics {
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/api/analytics(/.*)$ $1 break;
            proxy_pass http://analytics_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User $upstream_http_x_user;
            proxy_set_header Authorization $http_authorization;

            error_page 401 = @error401;
            error_page 403 = @error403;
        }

        location @error401 {
            return 401 '{"error": "Authentication required"}';
            add_header Content-Type application/json;
        }

        location @error403 {
            return 403 '{"error": "Access forbidden"}';
            add_header Content-Type application/json;
        }

        location / {
            return 404 '{"error": "Invalid path. Use /api/user/, /api/transaction/, /api/solver/, /api/submission/, /api/result/, or /api/analytics/"}';
            add_header Content-Type application/json;
        }
    }
}
